# https://hamvocke.com/blog/a-guide-to-customizing-your-tmux-conf/

set -g status-style bg=green,fg=black
set-window-option -g window-status-current-style reverse,bold

set -g base-index 1
setw -g pane-base-index 1
set-option -g renumber-windows on

set -g mouse on

unbind C-b
set-option -g prefix C-Space
bind-key C-Space send-prefix # change the prefix to whatev

set-option -g escape-time 10 # don't lag when pressing ctrl + [

# splitting and navigating panes:
# alt + shift + _        for horizonal split.
# alt + shift + +        for vertical split.
# alt + h/j/k/l          for moving right/down/up/left
# alt + shift + h/j/k/l  for resizing pane right/down/up/left

bind -n M-_ split-window -v
bind -n M-+ split-window -h

unbind '"'
unbind %

bind -n M-h select-pane -L
bind -n M-l select-pane -R
bind -n M-k select-pane -U
bind -n M-j select-pane -D

bind -n M-H resize-pane -L 1
bind -n M-L resize-pane -R 1
bind -n M-K resize-pane -U 1
bind -n M-J resize-pane -D 1

# press prefix-key + =  to make all panes equal
bind = select-layout even-horizontal

# vi mode (hjkl navigation)
# this is for when u want to move cursor around terminal like a text editor.
# to enter: prefix-key,[
# to exit: ctrl + c
set-window-option -g mode-keys vi
# select text with shift + v, copy with y
bind-key -T copy-mode-vi y send-keys -X copy-selection

